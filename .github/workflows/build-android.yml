name: Build Jitendra App Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: "21"
            cache: gradle

      - name: Install npm dependencies
        run: npm ci

      - name: Build Ionic Angular web app
        run: npm run build

      - name: Sync web build with Capacitor Android
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload debug APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: jitendraapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add APK download link to workflow summary
        env:
          APK_ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
        run: |
          echo "## Jitendra App — Android Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the APK artifact](${APK_ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"
