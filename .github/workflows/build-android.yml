name: Build Jitendra App Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install npm dependencies
        run: npm ci

      - name: Build Ionic Angular web app
        run: npm run build

      - name: Sync web build with Capacitor Android
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload debug APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: jitendraapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate APK download QR code
        env:
          APK_ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
        run: |
          curl -sS -G "https://api.qrserver.com/v1/create-qr-code/" \
            --data-urlencode "size=600x600" \
            --data-urlencode "format=png" \
            --data-urlencode "data=$APK_ARTIFACT_URL" \
            -o apk-download-qr.png

      - name: Upload APK QR code
        uses: actions/upload-artifact@v4
        with:
          name: jitendraapp-apk-download-qr
          path: apk-download-qr.png
          if-no-files-found: error
          retention-days: 14

      - name: Add APK download link and QR code to workflow summary
        env:
          APK_ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
        run: |
          ENCODED_URL=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["APK_ARTIFACT_URL"], safe=""))')

          echo "## Jitendra App — Android Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the APK artifact](${APK_ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Scan to open the APK download page" >> "$GITHUB_STEP_SUMMARY"
          echo "![APK Download QR Code](https://api.qrserver.com/v1/create-qr-code/?size=300x300&format=png&data=${ENCODED_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The QR PNG file is also available in the workflow artifacts as \`jitendraapp-apk-download-qr\`." >> "$GITHUB_STEP_SUMMARY"
